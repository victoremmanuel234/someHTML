<!DOCTYPE html>
<html>
    <head>
        <title>
            LearningHTML
        </title>
        <meta charset="utf-8">
        <style>
            
            .state{
                margin: 20px 20px 20px 20px;
                border: 20px solid #663399 ;
                padding: 20px;
                text-align: center;
                width: 100px;
                height: 100px;
                float: left;
                border-radius: 2em 2em;
                box-shadow: 5px 5px 5px 0px #0a82b9;
                transition: border 2s;
                background-image: linear-gradient(green,yellow,blue);

            }
            .state:active{
                border: 20px solid #5d08b2;
                transform:skew(40deg);  
                transform-origin: bottom left; 
            }
        </style>

        
    </head>
    <body>
        <div class = "India">
            <div class = "state">the state is Telangana</div>
            <div class="state">the state is Andhra Pradesh</div>
            <div class="state">this state is Kerala</div>
            <div class="state">this is Maharastra</div>
            <div class="state"> this is a Bad state</div>
        </div>
        
    </body>
</html>
